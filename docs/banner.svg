      </g>
      <g transform="translate(382 442)">
        <rect width="108" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#3d7af2" stroke-opacity="0.6"/>
        <text x="54" y="25" text-anchor="middle">Search</text>
      </g>
      <g transform="translate(0 492)">
        <rect width="172" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#3d7af2" stroke-opacity="0.6"/>
        <text x="86" y="25" text-anchor="middle">On this day</text>
