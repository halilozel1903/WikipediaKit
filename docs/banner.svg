    <clipPath id="ipadScreen"><rect x="742" y="128" width="420" height="300" rx="14"/></clipPath>
    <clipPath id="macScreen"><rect x="628" y="300" width="400" height="236" rx="6"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
