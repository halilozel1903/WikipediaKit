    </g>
    <text x="0" y="284" font-size="72" font-weight="700" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif">WikipediaKit</text>
    <text x="0" y="338" font-size="25" fill="#b9c7e8">A Swift client for Wikipedia's REST</text>
    <text x="0" y="370" font-size="25" fill="#b9c7e8">and Action APIs, with a reader app</text>
    <text x="0" y="402" font-size="25" fill="#b9c7e8">for iPad and Mac.</text>

    <g font-size="18" font-weight="600" fill="#dce6ff">
