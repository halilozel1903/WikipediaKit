name: WikiReader
options:
  bundleIdPrefix: io.github.halilozel1903
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  WikipediaKit:
    path: ..
targets:
  WikiReader:
    type: application
    platform: iOS
    sources:
      - Shared
      - iPad
    dependencies:
      - package: WikipediaKit
        product: WikipediaKit
      - package: WikipediaKit
        product: WikipediaUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.WikiReader
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wiki Reader
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "2"
  WikiReaderMac:
    type: application
    platform: macOS
    sources:
      - Shared
      - Mac
    dependencies:
      - package: WikipediaKit
        product: WikipediaKit
      - package: WikipediaKit
        product: WikipediaUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.WikiReaderMac
        PRODUCT_NAME: WikiReaderMac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wiki Reader
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Halil Özel"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
schemes:
  WikiReader:
    build:
      targets:
        WikiReader: all
    run:
      config: Debug
  WikiReaderMac:
    build:
      targets:
        WikiReaderMac: all
    run:
      config: Debug
