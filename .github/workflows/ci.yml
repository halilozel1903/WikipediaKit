name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift tests (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  test:
    name: Tests (iPadOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Build & test on an iPad simulator
        run: bash scripts/test.sh iOS

  example:
    name: Example apps
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: Example
        run: xcodegen generate
      - name: Build for iPad Simulator
        run: |
          xcodebuild build \
            -project Example/WikiReader.xcodeproj \
            -scheme WikiReader \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build for macOS
        run: |
          xcodebuild build \
            -project Example/WikiReader.xcodeproj \
            -scheme WikiReaderMac \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  screenshots:
    name: README screenshots
    if: github.event_name != 'pull_request'
    needs: [swift, test, example]
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: Example
        run: xcodegen generate
      - name: Check the live API
        run: |
          # Only a log line: the capture steps below fail on their own when the API is down.
          UA="WikiReader-CI/1.0 (https://github.com/halilozel1903/WikipediaKit) WikipediaKit/1.0"
          curl -sS -A "$UA" -o /dev/null -w "featured feed: HTTP %{http_code}\n" \
            https://en.wikipedia.org/api/rest_v1/feed/featured/2026/10/01 || true
          curl -sS -A "$UA" -o /dev/null -w "summary: HTTP %{http_code}\n" \
            https://en.wikipedia.org/api/rest_v1/page/summary/Apollo_11 || true
          curl -sS -A "$UA" -o /dev/null -w "related: HTTP %{http_code}\n" \
            https://en.wikipedia.org/api/rest_v1/page/related/Apollo_11 || true
      # Live data from the Wikipedia APIs and real images from upload.wikimedia.org;
      # writes mac-today.png and mac-search.png.
      - name: Capture Mac screenshots
        run: bash scripts/screenshots-mac.sh WikiReaderMac today search
      # Live data and images; writes ipad-today.png and ipad-article.png.
      - name: Capture iPad screenshots
        run: bash scripts/screenshots-ipad.sh WikiReader io.github.halilozel1903.WikiReader today article
      - name: Commit screenshots
        run: |
          git config user.name "Halil Özel"
          git config user.email "halilozel1903@gmail.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Update README screenshots [skip ci]"
            git push
          fi
